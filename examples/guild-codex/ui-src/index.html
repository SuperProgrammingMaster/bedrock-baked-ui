<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Aetherium Guild Codex</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 1056px; height: 594px; overflow: hidden;
    font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    background: #0d111a;
  }
  #app {
    position: relative; width: 1056px; height: 594px; overflow: hidden;
    background:
      radial-gradient(circle at 20% 18%, rgba(56, 189, 248, 0.10), transparent 42%),
      radial-gradient(circle at 82% 22%, rgba(245, 194, 78, 0.10), transparent 46%),
      repeating-linear-gradient(0deg, #0f1420 0px, #0f1420 20px, #0c101a 20px, #0c101a 22px);
    color: #f1efe9;
  }
  .a { position: absolute; overflow: hidden; }
  svg.lucide { display: block; flex-shrink: 0; }

  /* Layered Obsidian & Burnished Brass Bevel Panels */
  .obsidian-frame {
    background: linear-gradient(180deg, #171e2e 0%, #101521 100%);
    border: 3px solid;
    border-color: #4f412c #07090f #07090f #4f412c;
    box-shadow: inset 0 0 0 1px rgba(246, 207, 102, 0.14);
  }
  .brass-frame {
    background: linear-gradient(180deg, #1b2234 0%, #121724 100%);
    border: 3px solid;
    border-color: #c89b3c #3d2a0d #3d2a0d #c89b3c;
    box-shadow: inset 0 0 0 1px rgba(255, 232, 163, 0.16);
  }
  .sub-panel {
    background: linear-gradient(180deg, #1f273b 0%, #141a29 100%);
    border: 2px solid;
    border-color: #4b5878 #0a0d16 #0a0d16 #4b5878;
  }

  /* Glowing Lucide Icon Medallions & Badges */
  .ico-badge {
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    border-radius: 10px;
    border: 1.5px solid rgba(255, 255, 255, 0.14);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
  }
  .ico-badge.round { border-radius: 50%; }
  .ico-badge.gold {
    background: radial-gradient(circle at 30% 25%, rgba(251, 191, 36, 0.28), rgba(43, 30, 11, 0.92));
    border-color: rgba(246, 207, 102, 0.72);
    color: #fde68a;
  }
  .ico-badge.violet {
    background: radial-gradient(circle at 30% 25%, rgba(167, 139, 250, 0.30), rgba(33, 18, 56, 0.92));
    border-color: rgba(192, 132, 252, 0.72);
    color: #ddd6fe;
  }
  .ico-badge.emerald {
    background: radial-gradient(circle at 30% 25%, rgba(52, 211, 153, 0.28), rgba(12, 40, 31, 0.92));
    border-color: rgba(52, 211, 153, 0.72);
    color: #a7f3d0;
  }
  .ico-badge.sky {
    background: radial-gradient(circle at 30% 25%, rgba(56, 189, 248, 0.30), rgba(12, 34, 52, 0.92));
    border-color: rgba(56, 189, 248, 0.75);
    color: #bae6fd;
  }
  .ico-badge.crimson {
    background: radial-gradient(circle at 30% 25%, rgba(251, 113, 133, 0.30), rgba(50, 15, 24, 0.92));
    border-color: rgba(251, 113, 133, 0.75);
    color: #fecdd3;
  }

  /* Navigation & Action Buttons */
  .nav-btn {
    background: linear-gradient(180deg, #1d2538 0%, #141a28 100%);
    border: 3px solid;
    border-color: #43506e #090c14 #090c14 #43506e;
    color: #c9d2e3;
    cursor: pointer;
    display: flex; align-items: center; padding: 0 12px; gap: 10px;
    font-size: 13px; font-weight: 800; letter-spacing: 0.3px; white-space: nowrap;
  }
  .nav-btn.on {
    background: linear-gradient(180deg, #433219 0%, #2a1e0e 100%);
    border-color: #f6cf66 #6e4a12 #6e4a12 #f6cf66;
    color: #fff4d1;
    box-shadow: inset 0 0 14px rgba(246, 207, 102, 0.18);
  }
  .nav-btn.on svg.lucide { color: #fde68a; filter: drop-shadow(0 0 4px rgba(253, 230, 138, 0.55)); }

  .btn {
    border: 3px solid;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    font-weight: 900; letter-spacing: 0.4px;
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.55);
  }
  .btn.emerald {
    background: linear-gradient(180deg, #1e7a50 0%, #124f33 100%);
    border-color: #6ee7b7 #0a2e1d #0a2e1d #6ee7b7;
    color: #ecfdf5;
  }
  .btn.gold {
    background: linear-gradient(180deg, #b58222 0%, #78510d 100%);
    border-color: #fde68a #3d2705 #3d2705 #fde68a;
    color: #fffbeb;
  }
  .btn.crimson {
    background: linear-gradient(180deg, #a62b30 0%, #6b1519 100%);
    border-color: #fca5a5 #38090b #38090b #fca5a5;
    color: #fff1f2;
  }
  .btn.slate {
    background: linear-gradient(180deg, #2b3650 0%, #1b2336 100%);
    border-color: #7c8fb8 #0c101a #0c101a #7c8fb8;
    color: #e2e8f0;
  }
  .btn.arcane {
    background: linear-gradient(180deg, #563291 0%, #341c5e 100%);
    border-color: #c4b5fd #1b0e33 #1b0e33 #c4b5fd;
    color: #f5f3ff;
  }

  /* Interactive Cards */
  .class-card {
    background: linear-gradient(180deg, #1e2639 0%, #131826 100%);
    border: 3px solid;
    border-color: #526184 #0a0d16 #0a0d16 #526184;
    cursor: pointer;
    padding: 12px 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    text-align: center;
  }
  .class-card.knight { border-top-color: #f6cf66; }
  .class-card.arcanist { border-top-color: #a78bfa; }
  .class-card.ranger { border-top-color: #34d399; }
  .class-card.cleric { border-top-color: #38bdf8; }

  .relic-card {
    background: linear-gradient(180deg, #1c2436 0%, #121724 100%);
    border: 3px solid;
    border-color: #4b5978 #090c14 #090c14 #4b5978;
    cursor: pointer;
    padding: 10px 12px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .relic-card.legendary { border-color: #f6cf66 #543a0c #543a0c #f6cf66; }
  .relic-card.epic { border-color: #c084fc #3b1c5c #3b1c5c #c084fc; }
  .relic-card.rare { border-color: #38bdf8 #103a52 #103a52 #38bdf8; }
  .relic-card.uncommon { border-color: #34d399 #0d3d2b #0d3d2b #34d399; }

  .quest-card {
    background: linear-gradient(90deg, #1d2538 0%, #151b2b 72%, #1d1924 100%);
    border: 3px solid;
    border-color: #5b4c32 #0b0e17 #0b0e17 #5b4c32;
    cursor: pointer;
    padding: 10px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
  }

  .setting-card {
    background: linear-gradient(180deg, #1f283d 0%, #141a29 100%);
    border: 3px solid;
    border-color: #58688c #0a0d16 #0a0d16 #58688c;
    cursor: pointer;
    padding: 12px 16px;
    display: flex; align-items: center; gap: 14px;
  }

  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px;
    font-size: 11px; font-weight: 900; letter-spacing: 0.4px;
    border: 1px solid rgba(255, 255, 255, 0.16);
  }
  .pill.gold { background: #3b2a10; color: #fde68a; border-color: #c89b3c; }
  .pill.cyan { background: #0e2e3f; color: #7dd3fc; border-color: #38bdf8; }
  .pill.violet { background: #2c1647; color: #ddd6fe; border-color: #a78bfa; }
  .pill.emerald { background: #0d3324; color: #6ee7b7; border-color: #34d399; }
  .pill.crimson { background: #3f1116; color: #fda4af; border-color: #f43f5e; }

  /* Opaque solid containers strictly required for every [data-dyn] slot */
  .wallet-box {
    background-color: #111622;
    border: 3px solid;
    border-color: #070a10 #5c4928 #5c4928 #070a10;
  }
  .dynval {
    background-color: #111622;
    color: #fde68a;
    font-size: 15px;
    font-weight: 900;
    display: flex; align-items: center;
    white-space: nowrap;
  }
  .dock-box {
    background-color: #0f1420;
    border: 3px solid;
    border-color: #594626 #06080d #06080d #594626;
  }
  .dynrow {
    background-color: #0f1420;
    color: #f1f5f9;
    font-size: 14px;
    font-weight: 800;
    display: flex; align-items: center; padding-left: 6px;
    white-space: nowrap;
  }

  /* Lucide-Powered Flipbook Animation Stages */
  .anim-stage {
    position: relative;
    overflow: hidden;
    background: #0c101b;
  }
  .anim-layer {
    position: absolute;
    left: 50%; top: 50%;
    transform-origin: center center;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<!-- Local bundled Lucide Icons (v1.75.0, ISC License) for 100% offline headless baking -->
<script src="./vendor/lucide.min.js"></script>
<script>
(function () {
  var state = { lang: 'en', tab: 'home' }; // 8 additive states: en_*, ko_*
  var animPhase = 0;

  function T(en, ko) { return state.lang === 'ko' ? ko : en; }
  function keyOf(s) { return s.lang + '_' + s.tab; }

  function ico(name, size, color, stroke) {
    return '<i data-lucide="' + name + '" style="width:' + size + 'px;height:' + size + 'px;' +
      (color ? 'color:' + color + ';' : '') + '" data-stroke="' + (stroke || 2) + '"></i>';
  }

  function badge(name, tone, boxSize, iconSize, round) {
    return '<div class="ico-badge ' + tone + (round ? ' round' : '') + '" style="width:' + boxSize + 'px;height:' + boxSize + 'px;">' +
      ico(name, iconSize, '', 2.1) +
    '</div>';
  }

  /* Animation 1: Lucide-driven Arcane Orbit & Compass Core (114x114 @ 2x * 12f = 2736px <= 2800px) */
  function portalAnimHtml() {
    return (
      '<div id="portal_stage" class="a anim-stage" data-anim="portal_core" data-frames="12" data-fps="6" style="left:0px;top:0px;width:114px;height:114px;">' +
        '<div id="p_glow" class="anim-layer" style="width:94px;height:94px;margin:-47px 0 0 -47px;border-radius:50%;background:radial-gradient(circle, rgba(56,189,248,0.45) 0%, rgba(124,58,237,0.28) 46%, rgba(12,16,27,0) 74%);"></div>' +
        '<svg id="p_ring" class="anim-layer" width="98" height="98" viewBox="0 0 98 98" style="margin:-49px 0 0 -49px;">' +
          '<circle cx="49" cy="49" r="44" fill="none" stroke="#c89b3c" stroke-width="2.2" stroke-dasharray="18 16.56" stroke-linecap="round"/>' +
        '</svg>' +
        '<div id="p_orbit" class="anim-layer" style="width:64px;height:64px;margin:-32px 0 0 -32px;display:flex;align-items:center;justify-content:center;color:#7dd3fc;filter:drop-shadow(0 0 8px rgba(56,189,248,0.85));">' +
          ico('orbit', 62, '#7dd3fc', 1.7) +
        '</div>' +
        '<div id="p_core" class="anim-layer" style="width:30px;height:30px;margin:-15px 0 0 -15px;display:flex;align-items:center;justify-content:center;color:#fde68a;filter:drop-shadow(0 0 7px rgba(253,230,138,0.9));">' +
          ico('gem', 24, '#fef08a', 2.2) +
        '</div>' +
        '<div id="p_sp0" class="anim-layer" style="width:14px;height:14px;margin:-7px 0 0 -7px;color:#fde68a;">' + ico('sparkle', 13, '#fde68a', 2.2) + '</div>' +
        '<div id="p_sp1" class="anim-layer" style="width:14px;height:14px;margin:-7px 0 0 -7px;color:#bae6fd;">' + ico('sparkle', 11, '#bae6fd', 2.2) + '</div>' +
        '<div id="p_sp2" class="anim-layer" style="width:14px;height:14px;margin:-7px 0 0 -7px;color:#ddd6fe;">' + ico('sparkle', 12, '#ddd6fe', 2.2) + '</div>' +
      '</div>'
    );
  }

  /* Animation 2: Lucide-driven Runic Forge (Flame + Anvil + Hammer + Sparkles, 138x76 @ 2x * 10f = 2760px <= 2800px) */
  function forgeAnimHtml() {
    return (
      '<div id="forge_stage" class="a anim-stage" data-anim="forge_flame" data-frames="10" data-fps="6" style="left:0px;top:0px;width:138px;height:76px;background:#111623;">' +
        '<div id="f_glow" class="anim-layer" style="width:116px;height:76px;margin:-38px 0 0 -58px;background:radial-gradient(circle at 50% 68%, rgba(249,115,22,0.48) 0%, rgba(234,179,8,0.18) 42%, rgba(17,22,35,0) 75%);"></div>' +
        '<div id="f_flame_bg" class="anim-layer" style="width:44px;height:44px;margin:-29px 0 0 -22px;color:#f97316;filter:drop-shadow(0 0 8px rgba(249,115,22,0.85));">' +
          ico('flame', 44, '#f97316', 1.8) +
        '</div>' +
        '<div id="f_flame_fg" class="anim-layer" style="width:28px;height:28px;margin:-18px 0 0 -14px;color:#fef08a;">' +
          ico('flame', 28, '#fef08a', 2.0) +
        '</div>' +
        '<div class="anim-layer" style="width:36px;height:36px;margin:-2px 0 0 -18px;color:#cbd5e1;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.8));">' +
          ico('anvil', 34, '#cbd5e1', 2.0) +
        '</div>' +
        '<div id="f_hammer" class="anim-layer" style="width:28px;height:28px;margin:-26px 0 0 12px;color:#fde68a;filter:drop-shadow(0 0 5px rgba(253,230,138,0.65));">' +
          ico('hammer', 26, '#fde68a', 2.1) +
        '</div>' +
        '<div id="f_sp0" class="anim-layer" style="width:12px;height:12px;margin:-6px 0 0 -6px;color:#fef08a;">' + ico('sparkle', 11, '#fef08a', 2.2) + '</div>' +
        '<div id="f_sp1" class="anim-layer" style="width:12px;height:12px;margin:-6px 0 0 -6px;color:#fb923c;">' + ico('sparkle', 10, '#fb923c', 2.2) + '</div>' +
        '<div id="f_sp2" class="anim-layer" style="width:12px;height:12px;margin:-6px 0 0 -6px;color:#fde68a;">' + ico('sparkle', 12, '#fde68a', 2.2) + '</div>' +
      '</div>'
    );
  }

  /* Pure periodic phase [0, 1) animation update for both Lucide SVG stages */
  function updateLucideAnims(phase) {
    var tau = Math.PI * 2;
    var s = Math.sin(phase * tau);
    var c = Math.cos(phase * tau);

    var pGlow = document.getElementById('p_glow');
    if (pGlow) {
      pGlow.style.transform = 'scale(' + (0.94 + s * 0.10).toFixed(3) + ')';
      pGlow.style.opacity = (0.78 + s * 0.20).toFixed(3);
      var pRing = document.getElementById('p_ring');
      if (pRing) pRing.style.transform = 'rotate(' + (phase * 45).toFixed(2) + 'deg)';
      var pOrbit = document.getElementById('p_orbit');
      if (pOrbit) pOrbit.style.transform = 'rotate(' + (phase * 180).toFixed(2) + 'deg) scale(' + (0.96 + c * 0.05).toFixed(3) + ')';
      var pCore = document.getElementById('p_core');
      if (pCore) pCore.style.transform = 'translateY(' + (s * -3.5).toFixed(2) + 'px) scale(' + (1 + c * 0.08).toFixed(3) + ')';

      for (var i = 0; i < 3; i++) {
        var sp = document.getElementById('p_sp' + i);
        if (!sp) continue;
        var ang = (phase + i / 3) * tau;
        var rx = Math.cos(ang) * 38;
        var ry = Math.sin(ang) * 26;
        var tw = 0.65 + 0.35 * Math.sin((phase * 2 + i * 0.33) * tau);
        sp.style.transform = 'translate(' + rx.toFixed(1) + 'px,' + ry.toFixed(1) + 'px) scale(' + tw.toFixed(2) + ')';
        sp.style.opacity = tw.toFixed(2);
      }
    }

    var fGlow = document.getElementById('f_glow');
    if (fGlow) {
      fGlow.style.opacity = (0.76 + s * 0.22).toFixed(3);
      var fBg = document.getElementById('f_flame_bg');
      if (fBg) fBg.style.transform = 'scaleX(' + (1 + c * 0.09).toFixed(3) + ') scaleY(' + (1 + s * 0.14).toFixed(3) + ')';
      var fFg = document.getElementById('f_flame_fg');
      if (fFg) fFg.style.transform = 'translateY(' + (-s * 2.5).toFixed(2) + 'px) scale(' + (0.95 - c * 0.12).toFixed(3) + ')';
      var fHam = document.getElementById('f_hammer');
      if (fHam) {
        // Rhythmic smithing swing
        var swing = Math.sin(phase * tau) * 18;
        fHam.style.transform = 'rotate(' + (-26 + swing).toFixed(2) + 'deg) translateY(' + (Math.max(0, swing) * 0.25).toFixed(2) + 'px)';
      }
      var xOffs = [-34, -4, 28];
      for (var k = 0; k < 3; k++) {
        var fsp = document.getElementById('f_sp' + k);
        if (!fsp) continue;
        var p = (phase + k * 0.333) % 1;
        var fx = xOffs[k] + Math.sin(p * tau) * 6;
        var fy = 18 - p * 46;
        var alpha = Math.sin(p * Math.PI);
        fsp.style.transform = 'translate(' + fx.toFixed(1) + 'px,' + fy.toFixed(1) + 'px) scale(' + (0.6 + alpha * 0.5).toFixed(2) + ')';
        fsp.style.opacity = alpha.toFixed(2);
      }
    }
  }

  function hydrateLucide(root) {
    if (window.lucide && window.lucide.createIcons) {
      window.lucide.createIcons({ root: root });
      root.querySelectorAll('svg.lucide').forEach(function (el) {
        var sw = el.getAttribute('data-stroke');
        if (sw) el.setAttribute('stroke-width', sw);
      });
    }
  }

  function renderChrome() {
    var nav = [
      { id: 'nav_home', tab: 'home', icon: 'shield-half', en: 'GUILD HALL', ko: '길드 본부' },
      { id: 'nav_shop', tab: 'shop', icon: 'swords', en: 'RELIC ARMORY', ko: '유물 무기고' },
      { id: 'nav_quests', tab: 'quests', icon: 'scroll-text', en: 'BOUNTY BOARD', ko: '현상금 의뢰' },
      { id: 'nav_profile', tab: 'profile', icon: 'sliders-horizontal', en: 'CODEX & SFX', ko: '도감 · 설정' }
    ];

    var navHtml = '';
    for (var i = 0; i < nav.length; i++) {
      var n = nav[i];
      navHtml +=
        '<div class="a nav-btn ' + (state.tab === n.tab ? 'on' : '') + '" data-hit="' + n.id + '" data-label="' + T(n.en, n.ko) + '" style="left:12px;top:' + (14 + i * 56) + 'px;width:174px;height:48px;">' +
          ico(n.icon, 19, state.tab === n.tab ? '#fde68a' : '#94a3b8', 2.1) +
          '<span>' + T(n.en, n.ko) + '</span>' +
        '</div>';
    }

    return (
      /* Top Header Bar */
      '<div class="a brass-frame" style="left:16px;top:14px;width:1024px;height:68px;">' +
        '<div class="a" style="left:14px;top:9px;width:44px;height:44px;">' + badge('crown', 'gold', 44, 24, false) + '</div>' +
        '<div class="a" style="left:70px;top:10px;width:430px;height:28px;font-size:21px;font-weight:900;color:#fef3c7;letter-spacing:0.8px;">' +
          T('AETHERIUM GUILD CODEX', '에테리움 길드 코덱스') +
        '</div>' +
        '<div class="a" style="left:70px;top:37px;width:430px;height:18px;font-size:12px;font-weight:700;color:#94a3b8;">' +
          T('SEASON IV · LUCIDE + BAKED UI SHOWCASE', '시즌 IV · LUCIDE + BAKED UI 쇼케이스') +
        '</div>' +
        /* Currency Slot 1: Gold (opaque #111622) */
        '<div class="a wallet-box" style="left:526px;top:11px;width:158px;height:40px;">' +
          '<div class="a" style="left:8px;top:7px;width:20px;height:20px;color:#fbbf24;">' + ico('coins', 20, '#fbbf24', 2.2) + '</div>' +
          '<div class="a dynval" data-dyn="gold" data-dyn-scale="0.95" data-dyn-align="left" style="left:34px;top:0px;width:116px;height:34px;">2,450 G</div>' +
        '</div>' +
        /* Currency Slot 2: Gems (opaque #111622) */
        '<div class="a wallet-box" style="left:694px;top:11px;width:144px;height:40px;">' +
          '<div class="a" style="left:8px;top:7px;width:20px;height:20px;color:#38bdf8;">' + ico('gem', 20, '#38bdf8', 2.2) + '</div>' +
          '<div class="a dynval" data-dyn="gems" data-dyn-scale="0.95" data-dyn-align="left" style="left:34px;top:0px;width:102px;height:34px;color:#7dd3fc;">18 Gems</div>' +
        '</div>' +
        /* Language Toggle */
        '<div class="a btn slate" data-hit="set_lang" data-label="' + T('한국어', 'English') + '" style="left:848px;top:11px;width:92px;height:40px;font-size:13px;gap:6px;">' +
          ico('languages', 16, '#cbd5e1', 2.1) + '<span>' + T('한국어', 'EN') + '</span>' +
        '</div>' +
        /* Close Menu */
        '<div class="a btn crimson" data-hit="close_menu" data-special="close" data-label="' + T('Close', '닫기') + '" style="left:950px;top:11px;width:56px;height:40px;">' +
          ico('x', 22, '#fff1f2', 2.6) +
        '</div>' +
      '</div>' +

      /* Left Navigation Rail + Animated Lucide Portal Core */
      '<div class="a obsidian-frame" style="left:16px;top:92px;width:204px;height:382px;">' +
        navHtml +
        '<div class="a" style="left:39px;top:242px;width:120px;height:120px;border:3px solid #6e4e18;background:#0c101b;">' +
          portalAnimHtml() +
        '</div>' +
      '</div>' +

      /* Bottom Live Telemetry Dock (opaque #0f1420) */
      '<div class="a dock-box" style="left:16px;top:484px;width:1024px;height:96px;">' +

  function render() {
    var app = document.getElementById('app');
    var body = state.tab === 'shop' ? renderShop()
      : state.tab === 'quests' ? renderQuests()
      : state.tab === 'profile' ? renderProfile()
      : renderHome();
    app.innerHTML = renderChrome() + body;
    hydrateLucide(app);
    if (window.__BAKE_HEADLESS__) {
      app.querySelectorAll('[data-dyn]').forEach(function (el) { el.style.color = 'transparent'; });
    }
    updateLucideAnims(animPhase);
  }

  function onHit(id) {
    if (id === 'nav_home') state.tab = 'home';
    else if (id === 'nav_shop') state.tab = 'shop';
    else if (id === 'nav_quests') state.tab = 'quests';
    else if (id === 'nav_profile') state.tab = 'profile';
    else if (id === 'set_lang') state.lang = state.lang === 'ko' ? 'en' : 'ko';
    render();
  }

  document.getElementById('app').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-hit]');
    if (b) onHit(b.getAttribute('data-hit'));
  });

  render();

  if (!window.__BAKE_HEADLESS__) {
    var t0 = performance.now();
    var tick = function (now) {
      if (!window.__BAKE_PAUSED__) {
        animPhase = ((now - t0) % 2000) / 2000;
        updateLucideAnims(animPhase);
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  window.__BAKE__ = {
    getStateKey: function () { return keyOf(state); },
    getMeta: function () { return { url: 'codex://' + keyOf(state), title: 'Aetherium Guild Codex' }; },
    setStateKey: function (k) {
      var parts = String(k || 'en_home').split('_');
      state.lang = parts[0] === 'ko' ? 'ko' : 'en';
      var tab = parts[1];
      state.tab = (tab === 'shop' || tab === 'quests' || tab === 'profile') ? tab : 'home';
      render();
    },
    setAnimFrame: function (phase) {
      window.__BAKE_PAUSED__ = true;
      animPhase = phase;
      updateLucideAnims(animPhase);
    },
    clickHit: function (hitId) {
      var el = document.querySelector('[data-hit="' + hitId + '"]');
      if (el) el.click();
      return keyOf(state);
    }
  };
})();
