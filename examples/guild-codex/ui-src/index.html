<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Aetherium Guild Codex</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 1056px; height: 594px; overflow: hidden;
    font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    background: #0d111a;
  }
  #app {
    position: relative; width: 1056px; height: 594px; overflow: hidden;
    background:
      radial-gradient(circle at 22% 18%, rgba(56, 189, 248, 0.08), transparent 44%),
      radial-gradient(circle at 82% 24%, rgba(245, 194, 78, 0.09), transparent 48%),
      repeating-linear-gradient(0deg, #0f1420 0px, #0f1420 20px, #0c101a 20px, #0c101a 22px);
    color: #f1efe9;
  }
  .a { position: absolute; overflow: hidden; }

  /* Layered Obsidian & Burnished Brass Bevel Panels */
  .obsidian-frame {
    background: linear-gradient(180deg, #171e2e 0%, #111622 100%);
    border: 3px solid;
    border-color: #4f412c #07090f #07090f #4f412c;
    box-shadow: inset 0 0 0 1px rgba(246, 207, 102, 0.14);
  }
  .brass-frame {
    background: linear-gradient(180deg, #1b2234 0%, #121724 100%);
    border: 3px solid;
    border-color: #c89b3c #3d2a0d #3d2a0d #c89b3c;
    box-shadow: inset 0 0 0 1px rgba(255, 232, 163, 0.16);
  }
  .sub-panel {
    background: linear-gradient(180deg, #1f273b 0%, #151b2a 100%);
    border: 2px solid;
    border-color: #4b5878 #0a0d16 #0a0d16 #4b5878;
  }

  /* Navigation & Action Buttons */
  .nav-btn {
    background: linear-gradient(180deg, #1d2538 0%, #141a28 100%);
    border: 3px solid;
    border-color: #43506e #090c14 #090c14 #43506e;
    color: #c9d2e3;
    cursor: pointer;
    display: flex; align-items: center; padding: 0 12px; gap: 9px;
    font-size: 13px; font-weight: 800; letter-spacing: 0.3px; white-space: nowrap;
  }
  .nav-btn.on {
    background: linear-gradient(180deg, #433219 0%, #2a1e0e 100%);
    border-color: #f6cf66 #6e4a12 #6e4a12 #f6cf66;
    color: #fff4d1;
    box-shadow: inset 0 0 14px rgba(246, 207, 102, 0.18);
  }

  .btn {
    border: 3px solid;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-weight: 900; letter-spacing: 0.4px;
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.55);
  }
  .btn.emerald {
    background: linear-gradient(180deg, #1e7a50 0%, #124f33 100%);
    border-color: #6ee7b7 #0a2e1d #0a2e1d #6ee7b7;
    color: #ecfdf5;
  }
  .btn.gold {
    background: linear-gradient(180deg, #b58222 0%, #78510d 100%);
    border-color: #fde68a #3d2705 #3d2705 #fde68a;
    color: #fffbeb;
  }
  .btn.crimson {
    background: linear-gradient(180deg, #a62b30 0%, #6b1519 100%);
    border-color: #fca5a5 #38090b #38090b #fca5a5;
    color: #fff1f2;
  }
  .btn.slate {
    background: linear-gradient(180deg, #2b3650 0%, #1b2336 100%);
    border-color: #7c8fb8 #0c101a #0c101a #7c8fb8;
    color: #e2e8f0;
  }
  .btn.arcane {
    background: linear-gradient(180deg, #563291 0%, #341c5e 100%);
    border-color: #c4b5fd #1b0e33 #1b0e33 #c4b5fd;
    color: #f5f3ff;
  }

  /* Interactive Cards */
  .class-card {
    background: linear-gradient(180deg, #1e2639 0%, #131826 100%);
    border: 3px solid;
    border-color: #526184 #0a0d16 #0a0d16 #526184;
    cursor: pointer;
    padding: 12px 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    text-align: center;
  }
  .class-card.knight { border-top-color: #f6cf66; }
  .class-card.arcanist { border-top-color: #a78bfa; }
  .class-card.ranger { border-top-color: #34d399; }
  .class-card.cleric { border-top-color: #38bdf8; }

  .relic-card {
    background: linear-gradient(180deg, #1c2436 0%, #121724 100%);
    border: 3px solid;
    border-color: #4b5978 #090c14 #090c14 #4b5978;
    cursor: pointer;
    padding: 10px 12px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .relic-card.legendary { border-color: #f6cf66 #543a0c #543a0c #f6cf66; }
  .relic-card.epic { border-color: #c084fc #3b1c5c #3b1c5c #c084fc; }
  .relic-card.rare { border-color: #38bdf8 #103a52 #103a52 #38bdf8; }
  .relic-card.uncommon { border-color: #34d399 #0d3d2b #0d3d2b #34d399; }

  .quest-card {
    background: linear-gradient(90deg, #1d2538 0%, #151b2b 72%, #1d1924 100%);
    border: 3px solid;
    border-color: #5b4c32 #0b0e17 #0b0e17 #5b4c32;
    cursor: pointer;
    padding: 10px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
  }

  .setting-card {
    background: linear-gradient(180deg, #1f283d 0%, #141a29 100%);
    border: 3px solid;
    border-color: #58688c #0a0d16 #0a0d16 #58688c;
    cursor: pointer;
    padding: 12px 16px;
    display: flex; align-items: center; gap: 14px;
  }

  .pill {
    display: inline-flex; align-items: center;
    padding: 2px 8px;
    font-size: 11px; font-weight: 900; letter-spacing: 0.4px;
    border: 1px solid rgba(255, 255, 255, 0.16);
  }
  .pill.gold { background: #3b2a10; color: #fde68a; border-color: #c89b3c; }
  .pill.cyan { background: #0e2e3f; color: #7dd3fc; border-color: #38bdf8; }
  .pill.violet { background: #2c1647; color: #ddd6fe; border-color: #a78bfa; }
  .pill.emerald { background: #0d3324; color: #6ee7b7; border-color: #34d399; }
  .pill.crimson { background: #3f1116; color: #fda4af; border-color: #f43f5e; }

  /* Opaque solid containers strictly required for every [data-dyn] slot */
  .wallet-box {
    background-color: #111622;
    border: 3px solid;
    border-color: #070a10 #5c4928 #5c4928 #070a10;
  }
  .dynval {
    background-color: #111622;
    color: #fde68a;
    font-size: 15px;
    font-weight: 900;
    display: flex; align-items: center;
    white-space: nowrap;
  }
  .dock-box {
    background-color: #0f1420;
    border: 3px solid;
    border-color: #594626 #06080d #06080d #594626;
  }
  .dynrow {
    background-color: #0f1420;
    color: #f1f5f9;
    font-size: 14px;
    font-weight: 800;
    display: flex; align-items: center; padding-left: 6px;
    white-space: nowrap;
  }
</style>

  /* Animation 1: Seamless Arcane Portal Core (136x114 @ 2x * 10f = 2720px <= 2800px) */
  function drawPortalCore(phase) {
    var cv = document.getElementById('portal_cv');
    if (!cv) return;
    var dpr = window.devicePixelRatio || 1;
    var w = 136, h = 114;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
    }
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#0c101b';
    ctx.fillRect(0, 0, w, h);

    var cx = w / 2, cy = h / 2;
    var tau = Math.PI * 2;
    var pulse = Math.sin(phase * tau);

    // Outer arcane glow halo
    var grad = ctx.createRadialGradient(cx, cy, 4, cx, cy, 52 + pulse * 4);
    grad.addColorStop(0, 'rgba(125, 211, 252, 0.72)');
    grad.addColorStop(0.45, 'rgba(124, 58, 237, 0.42)');
    grad.addColorStop(1, 'rgba(12, 16, 27, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // Rotating segmented rune ring (1 step per loop = seamless)
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate((phase * tau) / 8);
    ctx.strokeStyle = '#c89b3c';
    ctx.lineWidth = 2.5;
    for (var s = 0; s < 8; s++) {
      var a0 = (s / 8) * tau + 0.08;
      var a1 = ((s + 1) / 8) * tau - 0.14;
      ctx.beginPath();
      ctx.arc(0, 0, 42, a0, a1);
      ctx.stroke();
    }
    ctx.restore();

    // Counter-rotating inner cyan ring
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-(phase * tau) / 4);
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2;
    for (var k = 0; k < 4; k++) {
      var b0 = (k / 4) * tau + 0.18;
      var b1 = ((k + 1) / 4) * tau - 0.35;
      ctx.beginPath();
      ctx.arc(0, 0, 27, b0, b1);
      ctx.stroke();
    }
    ctx.restore();

    // Levitating crystal diamond
    var bob = Math.round(pulse * 4);
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 17 + bob);
    ctx.lineTo(cx + 12, cy + bob);
    ctx.lineTo(cx, cy + 17 + bob);
    ctx.lineTo(cx - 12, cy + bob);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#e0f2fe';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 12 + bob);
    ctx.lineTo(cx + 6, cy - 1 + bob);
    ctx.lineTo(cx, cy + 5 + bob);
    ctx.lineTo(cx - 6, cy - 1 + bob);
    ctx.closePath();
    ctx.fill();

    // 6 orbiting golden sparks
    for (var i = 0; i < 6; i++) {
      var ang = (phase + i / 6) * tau;
      var sx = Math.round(cx + Math.cos(ang) * 34);
      var sy = Math.round(cy + Math.sin(ang) * 20);
      ctx.fillStyle = i % 2 === 0 ? '#fde68a' : '#7dd3fc';
      ctx.fillRect(sx - 2, sy - 2, 4, 4);
    }
  }

  /* Animation 2: Runic Hearth Brazier on Armory Tab (160x76 @ 2x * 8f = 2560px <= 2800px) */
  function drawForgeFlame(phase) {
    var cv = document.getElementById('forge_cv');
    if (!cv) return;
    var dpr = window.devicePixelRatio || 1;
    var w = 160, h = 76;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
    }
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#121622';
    ctx.fillRect(0, 0, w, h);

    var tau = Math.PI * 2;
    // Warm hearth glow
    var g = ctx.createRadialGradient(80, 56, 6, 80, 48, 66);
    g.addColorStop(0, 'rgba(251, 146, 60, 0.52)');
    g.addColorStop(1, 'rgba(18, 22, 34, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    // Stone brazier basin
    ctx.fillStyle = '#334155';
    ctx.fillRect(28, 58, 104, 12);
    ctx.fillStyle = '#64748b';
    ctx.fillRect(24, 54, 112, 5);

    // Pixelated flickering flame columns
    var cols = [
      { x: 46, base: 5, off: 0.1 },
      { x: 56, base: 8, off: 0.45 },
      { x: 66, base: 11, off: 0.0 },
      { x: 76, base: 13, off: 0.6 },
      { x: 86, base: 11, off: 0.25 },
      { x: 96, base: 8, off: 0.75 },
      { x: 106, base: 5, off: 0.35 }
    ];
    for (var c = 0; c < cols.length; c++) {
      var col = cols[c];
      var steps = Math.max(3, col.base + Math.round(Math.sin((phase + col.off) * tau) * 2));
      for (var s = 0; s < steps; s++) {
        var frac = s / steps;
        ctx.fillStyle = frac > 0.72 ? '#dc2626' : (frac > 0.45 ? '#f97316' : (frac > 0.2 ? '#facc15' : '#fef9c3'));
        ctx.fillRect(col.x, 51 - s * 3, 8, 3);
      }
    }

    // Rising embers (seamless wrap)
    var sparks = [42, 62, 82, 100, 118];
    for (var sp = 0; sp < sparks.length; sp++) {
      var p = (phase + sp * 0.2) % 1;
      var ex = sparks[sp] + Math.round(Math.sin(p * tau) * 4);
      var ey = Math.round(52 - p * 46);
      if (ey > 4) {
        ctx.fillStyle = sp % 2 === 0 ? '#fde047' : '#fb923c';
        ctx.fillRect(ex, ey, 3, 3);
      }
    }
  }

  function onHit(id) {
    if (id === 'nav_home') state.tab = 'home';
    else if (id === 'nav_shop') state.tab = 'shop';
    else if (id === 'nav_quests') state.tab = 'quests';
    else if (id === 'nav_profile') state.tab = 'profile';
    else if (id === 'set_lang') state.lang = state.lang === 'ko' ? 'en' : 'ko';
    render();
  }

  document.getElementById('app').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-hit]');
    if (b) onHit(b.getAttribute('data-hit'));
  });

  render();

  if (!window.__BAKE_HEADLESS__) {
    var t0 = performance.now();
    var tick = function (now) {
      if (!window.__BAKE_PAUSED__) {
        animPhase = ((now - t0) % 2000) / 2000;
        redrawAnims(animPhase);
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  window.__BAKE__ = {
    getStateKey: function () { return keyOf(state); },
    getMeta: function () { return { url: 'codex://' + keyOf(state), title: 'Aetherium Guild Codex' }; },
    setStateKey: function (k) {
      var parts = String(k || 'en_home').split('_');
      state.lang = parts[0] === 'ko' ? 'ko' : 'en';
      var tab = parts[1];
      state.tab = (tab === 'shop' || tab === 'quests' || tab === 'profile') ? tab : 'home';
      render();
    },
    setAnimFrame: function (phase) {
      window.__BAKE_PAUSED__ = true;
      animPhase = phase;
      redrawAnims(animPhase);
    },
    clickHit: function (hitId) {
      var el = document.querySelector('[data-hit="' + hitId + '"]');
      if (el) el.click();
      return keyOf(state);
    }
  };
})();
</script>
</body>
</html>
