<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Aetherium // Bedrock Field Codex</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 1056px; height: 594px; overflow: hidden;
    font-family: "Segoe UI", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0b0e0a;
    color: #edf2e8;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    position: relative; width: 1056px; height: 594px; overflow: hidden;
    background:
      radial-gradient(ellipse 65% 55% at 74% 38%, rgba(168, 230, 77, 0.055), transparent 70%),
      #0b0e0a;
  }
  .a { position: absolute; overflow: hidden; }
  .mono { font-family: "Cascadia Code", "Consolas", "SFMono-Regular", ui-monospace, monospace; }
  svg.lucide { display: block; flex-shrink: 0; }

  /* Top Editorial Navbar (1px matte hairline) */
  .topbar {
    background: rgba(11, 14, 10, 0.96);
    border-bottom: 1px solid #1d251b;
  }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 6px;
    background: #b4f055; color: #0b0e0a;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-link {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
    color: #778471;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
  }
  .nav-link.on {
    color: #edf2e8;
    background: #161d14;
    border: 1px solid #283424;
  }
  .nav-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: #b4f055;
    box-shadow: 0 0 8px rgba(180, 240, 85, 0.9);
  }

  /* Modern Studio Buttons */
  .lime-btn {
    background: #b4f055;
    color: #0b0e0a;
    border: 1px solid #cef78a;
    border-radius: 7px;
    font-weight: 800;
    letter-spacing: 0.7px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(180, 240, 85, 0.14);
  }
  .ghost-btn {
    background: #111610;
    color: #cdd8c6;
    border: 1px solid #253022;
    border-radius: 7px;
    font-weight: 700;
    letter-spacing: 0.6px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer;
  }
  .ghost-btn.on {
    background: #b4f055;
    color: #0b0e0a;
    border-color: #cef78a;
    font-weight: 800;
  }
  .close-btn {
    background: #131812;
    color: #8f9d89;
    border: 1px solid #242e21;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  /* Editorial Hero Typography */
  .eyebrow {
    display: flex; align-items: center; gap: 8px;
    font-size: 10.5px; font-weight: 700; letter-spacing: 1.5px;
    color: #93a87b;
    text-transform: uppercase;
  }
  .hero-h1 {
    font-size: 46px; font-weight: 900; line-height: 0.96; letter-spacing: -1.6px;
    color: #edf2e8;
  }
  .hero-h1.ko { font-size: 40px; line-height: 1.08; letter-spacing: -1.2px; }
  .hero-h1 .lime { color: #b4f055; }
  .hero-lead {
    font-size: 13px; line-height: 1.58; color: #94a18e; font-weight: 400;
  }

  /* Viewport Showcase Card (matches reference right-side frame) */
  .viewport-card {
    background: #0e130d;
    border: 1px solid #222c1f;
    border-radius: 14px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
  }
  .glass-chip {
    background: rgba(11, 15, 10, 0.78);
    border: 1px solid rgba(180, 240, 85, 0.22);
    border-radius: 8px;
    padding: 6px 10px;
  }
  .glass-pill {
    background: rgba(11, 15, 10, 0.80);
    border: 1px solid #273223;
    border-radius: 999px;
    padding: 5px 11px;
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 10px; font-weight: 700; letter-spacing: 1.2px; color: #d7e2d1;
  }
  .selector-strip {
    background: #10150f;
    border: 1px solid #20291d;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px;
  }

  /* Minimalist Cards for Armory / Bounties / Build Notes */
  .web-card {
    background: #10150f;
    border: 1px solid #222c1f;
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .web-card.featured {
    border-color: rgba(180, 240, 85, 0.45);
    background: linear-gradient(180deg, #141c12 0%, #10150f 100%);
  }
  .icon-chip {
    width: 34px; height: 34px; border-radius: 8px;
    background: #161e14;
    border: 1px solid #283524;
    color: #b4f055;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .icon-chip.sky { color: #7dd3fc; border-color: #1f3947; background: #101c24; }
  .icon-chip.amber { color: #fcd34d; border-color: #423415; background: #1c170c; }
  .icon-chip.violet { color: #c4b5fd; border-color: #35254d; background: #181224; }
  .icon-chip.rose { color: #fda4af; border-color: #472029; background: #211015; }

  .tag-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 7px; border-radius: 4px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.7px;
    background: #172015; color: #b4f055; border: 1px solid #293824;
  }
  .tag-pill.muted { background: #151a14; color: #95a38f; border-color: #252e22; }
  .tag-pill.rose { background: #261318; color: #fda4af; border-color: #4a212b; }
  .tag-pill.sky { background: #11212b; color: #7dd3fc; border-color: #1f3c4f; }

  /* Sleek Opaque Bottom Telemetry Bar (required alpha=1 for [data-dyn]) */
  .footer-bar {
    background-color: #0e120d;
    border-top: 1px solid #1f281d;
  }
  .wallet-pill {
    background-color: #121710;
    border: 1px solid #232d20;
    border-radius: 7px;
  }
  .dynval {
    background-color: #121710;
    color: #edf2e8;
    font-size: 13px; font-weight: 800;
    display: flex; align-items: center;
    white-space: nowrap;
  }
  .dynrow {
    background-color: #0e120d;
    color: #dce5d7;
    font-size: 12.5px; font-weight: 700;
    display: flex; align-items: center;
    white-space: nowrap;
  }

  /* Lucide-Powered Flipbook Animation Stages */
  .anim-stage { position: relative; overflow: hidden; }
  .anim-layer { position: absolute; left: 50%; top: 50%; transform-origin: center center; pointer-events: none; }
</style>
</head>
<body>
<div id="app"></div>
<script src="./vendor/lucide.min.js"></script>
<script>
(function () {
  var state = { lang: 'en', tab: 'home' }; // 8 additive states: en_*, ko_*
  var animPhase = 0;

  function T(en, ko) { return state.lang === 'ko' ? ko : en; }
  function keyOf(s) { return s.lang + '_' + s.tab; }

  function ico(name, size, color, stroke) {
    return '<i data-lucide="' + name + '" style="width:' + size + 'px;height:' + size + 'px;' +
      (color ? 'color:' + color + ';' : '') + '" data-stroke="' + (stroke || 2) + '"></i>';
  }

  /* Procedural atmospheric Minecraft sunlit stone-ruin courtyard canvas (matches reference mood!) */
  function drawVoxelScene(canvasId, variant) {
    var cv = document.getElementById(canvasId);
    if (!cv) return;
    var w = parseInt(cv.getAttribute('data-w'), 10) || 580;
    var h = parseInt(cv.getAttribute('data-h'), 10) || 334;
    var dpr = window.devicePixelRatio || 1;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
    }
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 1. Sky / Ambient Background
    var sky = ctx.createLinearGradient(0, 0, w, h);
    if (variant === 'courtyard') {
      sky.addColorStop(0, '#090c08');
      sky.addColorStop(0.45, '#151c12');
      sky.addColorStop(0.75, '#465134');
      sky.addColorStop(1, '#1a2015');
    } else {
      sky.addColorStop(0, '#090b0d');
      sky.addColorStop(0.55, '#14191e');
      sky.addColorStop(1, '#0d110c');
    }
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h);

    if (variant === 'courtyard') {
      // Sunlit golden opening on the right half (ruined fortress courtyard)
      var sun = ctx.createRadialGradient(w * 0.72, h * 0.22, 10, w * 0.68, h * 0.45, w * 0.56);
      sun.addColorStop(0, 'rgba(244, 240, 194, 0.92)');
      sun.addColorStop(0.32, 'rgba(182, 198, 118, 0.52)');
      sun.addColorStop(0.68, 'rgba(66, 84, 46, 0.22)');
      sun.addColorStop(1, 'rgba(9, 12, 8, 0)');
      ctx.fillStyle = sun;
      ctx.fillRect(0, 0, w, h);

      // Distant voxel castle ruins silhouettes
      var blocks = [
        { x: 350, y: 74, w: 68, h: 112, c: '#5c6047' },
        { x: 350, y: 58, w: 18, h: 16, c: '#6e7355' },
        { x: 382, y: 58, w: 18, h: 16, c: '#6e7355' },
        { x: 432, y: 98, w: 58, h: 96, c: '#4c513c' },
        { x: 294, y: 120, w: 54, h: 80, c: '#3f4533' }
      ];
      for (var b = 0; b < blocks.length; b++) {
        var bl = blocks[b];
        ctx.fillStyle = bl.c;
        ctx.fillRect(bl.x, bl.y, bl.w, bl.h);
        // Subtle pixel brick lines
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        for (var gy = bl.y + 12; gy < bl.y + bl.h; gy += 12) ctx.fillRect(bl.x, gy, bl.w, 1);
        for (var gx = bl.x + 14; gx < bl.x + bl.w; gx += 14) ctx.fillRect(gx, bl.y, 1, bl.h);
      }

      // Sunlit cobblestone floor perspective stripes
      var flr = ctx.createLinearGradient(0, h * 0.58, 0, h);
      flr.addColorStop(0, '#5f6346');
      flr.addColorStop(0.45, '#3b402d');
      flr.addColorStop(1, '#12160f');
      ctx.fillStyle = flr;
      ctx.beginPath();
      ctx.moveTo(220, h * 0.60);
      ctx.lineTo(w, h * 0.56);
      ctx.lineTo(w, h);
      ctx.lineTo(150, h);
      ctx.closePath();
      ctx.fill();

      // Floor block grid lines
      ctx.strokeStyle = 'rgba(12, 16, 10, 0.45)';
      ctx.lineWidth = 1.5;
      for (var fy = 0; fy < 7; fy++) {
        var yLine = h * 0.62 + fy * fy * 4.2;
        ctx.beginPath(); ctx.moveTo(160, yLine); ctx.lineTo(w, yLine); ctx.stroke();
      }

      // Wooden crates on courtyard floor
      var crates = [
        { x: 296, y: 192, s: 28 },
        { x: 320, y: 204, s: 24 },
        { x: 274, y: 208, s: 22 }
      ];
      for (var cr = 0; cr < crates.length; cr++) {
        var k = crates[cr];
        ctx.fillStyle = '#5c4124';
        ctx.fillRect(k.x, k.y, k.s, k.s);
        ctx.fillStyle = '#785732';
        ctx.fillRect(k.x + 2, k.y + 2, k.s - 4, 4);
        ctx.strokeStyle = '#2a1c0d';
        ctx.lineWidth = 2;
        ctx.strokeRect(k.x + 1, k.y + 1, k.s - 2, k.s - 2);
      }

      // Lush Minecraft foliage canopy + hanging vines along top-right
      var leaves = [
        [305, -8, 44, 44, '#2d471d'], [344, -12, 54, 48, '#3b5c24'], [392, -6, 62, 52, '#4a6e2d'],
        [448, 0, 58, 48, '#385422'], [492, 14, 68, 56, '#2b421b'], [326, 26, 26, 36, '#3b5c24'],
        [424, 34, 24, 52, '#486b2b'], [466, 44, 20, 62, '#344f20'], [288, 12, 22, 54, '#2a401b']
      ];
      for (var lv = 0; lv < leaves.length; lv++) {
        var L = leaves[lv];
        ctx.fillStyle = L[4];
        ctx.fillRect(L[0], L[1], L[2], L[3]);
        ctx.fillStyle = 'rgba(180, 240, 85, 0.14)';
        ctx.fillRect(L[0] + 4, L[1] + 4, L[2] - 12, 6);
      }

      // Diagonal warm god-rays streaming from top-right through courtyard
      ctx.save();
      var ray = ctx.createLinearGradient(440, 0, 240, 290);
      ray.addColorStop(0, 'rgba(232, 244, 178, 0.28)');
      ray.addColorStop(1, 'rgba(232, 244, 178, 0)');
      ctx.fillStyle = ray;
      ctx.beginPath();
      ctx.moveTo(390, 0); ctx.lineTo(478, 0); ctx.lineTo(310, 310); ctx.lineTo(220, 310);
      ctx.closePath(); ctx.fill();
      ctx.restore();

      // Deep foreground stone wall on the left (peeking corner frame!)
      var wallW = 248;
      var wallGrad = ctx.createLinearGradient(0, 0, wallW, 0);
      wallGrad.addColorStop(0, '#070907');
      wallGrad.addColorStop(0.76, '#141912');
      wallGrad.addColorStop(1, '#262e21');
      ctx.fillStyle = wallGrad;
      ctx.fillRect(0, 0, wallW, h);

      // Stone brick mortar grid on left foreground wall
      for (var wy = 0; wy < h; wy += 28) {
        var shift = ((wy / 28) % 2) * 22;
        for (var wx = -22; wx < wallW; wx += 44) {
          var shade = (((wx * 7 + wy * 13) & 31) / 31) * 0.09;
          ctx.fillStyle = 'rgba(160, 185, 130,' + shade.toFixed(3) + ')';
          ctx.fillRect(wx + shift + 2, wy + 2, 40, 24);
        }
      }
      // Subtle moss patches near wall edge
      ctx.fillStyle = 'rgba(98, 138, 52, 0.25)';
      ctx.fillRect(216, 40, 28, 18);
      ctx.fillRect(224, 146, 22, 30);
      // Rim-lit corner bevel edge
      ctx.fillStyle = 'rgba(218, 236, 168, 0.24)';
      ctx.fillRect(wallW - 3, 0, 3, h);

      // Foreground right-edge silhouetted voxel pillar + knight shoulder silhouette
      ctx.fillStyle = '#181c14';
      ctx.fillRect(w - 58, 0, 58, h);
      ctx.fillStyle = '#2c3324';
      ctx.fillRect(w - 60, 0, 3, h);
      // Stylized blocky voxel shoulder peeking on right edge
      ctx.fillStyle = '#241a10';
      ctx.fillRect(w - 92, 168, 54, 48);
      ctx.fillStyle = '#4a361e';
      ctx.fillRect(w - 92, 168, 14, 48);
      ctx.fillStyle = '#334d22';
      ctx.fillRect(w - 102, 218, 36, 74);
      ctx.fillStyle = '#6d8a3f';
      ctx.fillRect(w - 102, 218, 10, 40);
    }

    // Smooth dark bottom scrim so overlaid white typography is razor-sharp
    var scrim = ctx.createLinearGradient(0, h * 0.45, 0, h);
    scrim.addColorStop(0, 'rgba(11, 14, 10, 0)');
    scrim.addColorStop(0.68, 'rgba(11, 14, 10, 0.72)');
    scrim.addColorStop(1, 'rgba(11, 14, 10, 0.96)');
    ctx.fillStyle = scrim;
    ctx.fillRect(0, 0, w, h);
  }

  /* Animation 1: Lucide Tactical Reticle & Orbit Core (112x112 @ 2x * 12f = 2688px <= 2800px) */
  function reticleAnimHtml() {
    return (
      '<div id="reticle_stage" class="a anim-stage" data-anim="tactical_reticle" data-frames="12" data-fps="6" style="left:212px;top:96px;width:112px;height:112px;background:transparent;">' +
        '<div id="r_halo" class="anim-layer" style="width:94px;height:94px;margin:-47px 0 0 -47px;border-radius:50%;background:radial-gradient(circle, rgba(180,240,85,0.28) 0%, rgba(180,240,85,0.06) 52%, rgba(11,14,10,0) 74%);"></div>' +
        '<svg id="r_ring" class="anim-layer" width="94" height="94" viewBox="0 0 94 94" style="margin:-47px 0 0 -47px;">' +
          '<circle cx="47" cy="47" r="41" fill="none" stroke="#b4f055" stroke-width="1.6" stroke-dasharray="14 18.2" stroke-linecap="round" opacity="0.72"/>' +
        '</svg>' +
        '<div id="r_cross" class="anim-layer" style="width:48px;height:48px;margin:-24px 0 0 -24px;display:flex;align-items:center;justify-content:center;color:#b4f055;filter:drop-shadow(0 0 7px rgba(180,240,85,0.85));">' +
          ico('crosshair', 42, '#b4f055', 1.75) +
        '</div>' +
        '<div id="r_sp0" class="anim-layer" style="width:12px;height:12px;margin:-6px 0 0 -6px;color:#d9f99d;">' + ico('sparkle', 11, '#d9f99d', 2.1) + '</div>' +
        '<div id="r_sp1" class="anim-layer" style="width:12px;height:12px;margin:-6px 0 0 -6px;color:#b4f055;">' + ico('sparkle', 10, '#b4f055', 2.1) + '</div>' +
      '</div>'
    );
  }

  /* Animation 2: Lucide Forge Core on Armory Tab (136x76 @ 2x * 10f = 2720px <= 2800px) */
  function forgeAnimHtml() {
    return (
      '<div id="forge_stage" class="a anim-stage" data-anim="forge_flame" data-frames="10" data-fps="6" style="left:0px;top:0px;width:136px;height:76px;background:#0f140e;">' +
        '<div id="f_glow" class="anim-layer" style="width:110px;height:74px;margin:-37px 0 0 -55px;background:radial-gradient(circle at 50% 66%, rgba(180,240,85,0.34) 0%, rgba(250,204,21,0.12) 45%, rgba(15,20,14,0) 75%);"></div>' +
        '<div id="f_flame_bg" class="anim-layer" style="width:40px;height:40px;margin:-27px 0 0 -20px;color:#b4f055;filter:drop-shadow(0 0 8px rgba(180,240,85,0.75));">' +
          ico('flame', 40, '#b4f055', 1.8) +
        '</div>' +
        '<div id="f_flame_fg" class="anim-layer" style="width:24px;height:24px;margin:-16px 0 0 -12px;color:#ecfccb;">' +
          ico('flame', 24, '#ecfccb', 2.0) +
        '</div>' +
        '<div class="anim-layer" style="width:34px;height:34px;margin:-2px 0 0 -17px;color:#dce5d7;">' +
          ico('anvil', 32, '#dce5d7', 1.9) +
        '</div>' +
        '<div id="f_hammer" class="anim-layer" style="width:26px;height:26px;margin:-25px 0 0 12px;color:#b4f055;">' +
          ico('hammer', 24, '#b4f055', 2.0) +
        '</div>' +
        '<div id="f_sp0" class="anim-layer" style="width:12px;height:12px;margin:-6px 0 0 -6px;color:#ecfccb;">' + ico('sparkle', 10, '#ecfccb', 2.1) + '</div>' +
        '<div id="f_sp1" class="anim-layer" style="width:12px;height:12px;margin:-6px 0 0 -6px;color:#b4f055;">' + ico('sparkle', 11, '#b4f055', 2.1) + '</div>' +
      '</div>'
    );
  }

  function updateLucideAnims(phase) {
    var tau = Math.PI * 2;
    var s = Math.sin(phase * tau);
    var c = Math.cos(phase * tau);

    var rHalo = document.getElementById('r_halo');
    if (rHalo) {
      rHalo.style.transform = 'scale(' + (0.90 + s * 0.14).toFixed(3) + ')';
      rHalo.style.opacity = (0.72 + s * 0.24).toFixed(3);
      var rRing = document.getElementById('r_ring');
      if (rRing) rRing.style.transform = 'rotate(' + (phase * 45).toFixed(2) + 'deg)';
      var rCross = document.getElementById('r_cross');
      if (rCross) rCross.style.transform = 'scale(' + (0.95 + c * 0.08).toFixed(3) + ') rotate(' + (s * 8).toFixed(2) + 'deg)';

      for (var i = 0; i < 2; i++) {
        var sp = document.getElementById('r_sp' + i);
        if (!sp) continue;
        var ang = (phase + i * 0.5) * tau;
        var rx = Math.cos(ang) * 35;
        var ry = Math.sin(ang) * 24;
        var tw = 0.55 + 0.45 * Math.sin((phase * 2 + i * 0.5) * tau);
        sp.style.transform = 'translate(' + rx.toFixed(1) + 'px,' + ry.toFixed(1) + 'px) scale(' + tw.toFixed(2) + ')';
        sp.style.opacity = tw.toFixed(2);
      }
    }

    var fGlow = document.getElementById('f_glow');
    if (fGlow) {
      fGlow.style.opacity = (0.75 + s * 0.22).toFixed(3);
      var fBg = document.getElementById('f_flame_bg');
      if (fBg) fBg.style.transform = 'scaleX(' + (1 + c * 0.10).toFixed(3) + ') scaleY(' + (1 + s * 0.14).toFixed(3) + ')';
      var fFg = document.getElementById('f_flame_fg');
      if (fFg) fFg.style.transform = 'translateY(' + (-s * 2.5).toFixed(2) + 'px) scale(' + (0.94 - c * 0.12).toFixed(3) + ')';
      var fHam = document.getElementById('f_hammer');
      if (fHam) {
        var swing = Math.sin(phase * tau) * 18;
        fHam.style.transform = 'rotate(' + (-24 + swing).toFixed(2) + 'deg)';
      }
      var xOffs = [-30, 26];
      for (var k = 0; k < 2; k++) {
        var fsp = document.getElementById('f_sp' + k);
        if (!fsp) continue;
        var p = (phase + k * 0.5) % 1;
        var fx = xOffs[k] + Math.sin(p * tau) * 5;
        var fy = 16 - p * 44;
        var alpha = Math.sin(p * Math.PI);
        fsp.style.transform = 'translate(' + fx.toFixed(1) + 'px,' + fy.toFixed(1) + 'px) scale(' + (0.6 + alpha * 0.5).toFixed(2) + ')';
        fsp.style.opacity = alpha.toFixed(2);
      }
    }
  }

  function hydrateLucide(root) {
    if (window.lucide && window.lucide.createIcons) {
      window.lucide.createIcons({ root: root });
      root.querySelectorAll('svg.lucide').forEach(function (el) {
        var sw = el.getAttribute('data-stroke');
        if (sw) el.setAttribute('stroke-width', sw);
      });
    }
  }

  function renderTopAndFooter() {
    var nav = [

        '</div>' +
        '<div style="height:1px;background:#1c241a;margin-top:26px;"></div>' +
        '<div class="mono" style="margin-top:14px;font-size:10px;line-height:1.9;color:#6f7d69;">' +
          'STATES: 8 / 64 MAX<br/>DYN SLOTS: 4 SHARED<br/>FLIPBOOKS: 2 LUCIDE SVG' +
        '</div>' +
      '</div>' +
      grid
    );
  }

  function render() {
    var app = document.getElementById('app');
    var body = state.tab === 'shop' ? renderShop()
      : state.tab === 'quests' ? renderQuests()
      : state.tab === 'profile' ? renderProfile()
      : renderHome();
    app.innerHTML = renderTopAndFooter() + body;
    hydrateLucide(app);
    drawVoxelScene('courtyard_cv', 'courtyard');
    if (window.__BAKE_HEADLESS__) {
      app.querySelectorAll('[data-dyn]').forEach(function (el) { el.style.color = 'transparent'; });
    }
    updateLucideAnims(animPhase);
  }

  function onHit(id) {
    if (id === 'nav_home') state.tab = 'home';
    else if (id === 'nav_shop') state.tab = 'shop';
    else if (id === 'nav_quests') state.tab = 'quests';
    else if (id === 'nav_profile') state.tab = 'profile';
    else if (id === 'set_lang') state.lang = state.lang === 'ko' ? 'en' : 'ko';
    render();
  }

  document.getElementById('app').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-hit]');
    if (b) onHit(b.getAttribute('data-hit'));
  });

  render();

  if (!window.__BAKE_HEADLESS__) {
    var t0 = performance.now();
    var tick = function (now) {
      if (!window.__BAKE_PAUSED__) {
        animPhase = ((now - t0) % 2000) / 2000;
        updateLucideAnims(animPhase);
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  window.__BAKE__ = {
    getStateKey: function () { return keyOf(state); },
    getMeta: function () { return { url: 'codex://' + keyOf(state), title: 'Aetherium Field Codex' }; },
    setStateKey: function (k) {
      var parts = String(k || 'en_home').split('_');
      state.lang = parts[0] === 'ko' ? 'ko' : 'en';
      var tab = parts[1];
      state.tab = (tab === 'shop' || tab === 'quests' || tab === 'profile') ? tab : 'home';
      render();
    },
    setAnimFrame: function (phase) {
      window.__BAKE_PAUSED__ = true;
      animPhase = phase;
      updateLucideAnims(animPhase);
    },
    clickHit: function (hitId) {
      var el = document.querySelector('[data-hit="' + hitId + '"]');
      if (el) el.click();
      return keyOf(state);
    }
  };
})();
</script>
</body>
</html>
